<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEADER</title>
    <link rel="stylesheet" href="assets/css/header.css">
</head>
<body>
    <header>
        <nav class="header-nav">
            <ul class="header-nav-list">
                <li><a class="active">Home</a></li>
                <li><a>Sobre</a></li>
                <li><a>Contatos</a></li>
                <li><a>Produtos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="card">
                <img src="./assets/img/colonia-vermelha.webp" alt="">
                
                <h1>Corrida Orbital</h1>
            </div>
            <div class="card">
                <img src="./assets/img/corrida-orbita.webp" alt="">
                <h1>Corrida Orbital</h1>
            </div>
            <div class="card">
                <img src="./assets/img/ecos-de-aurea.webp" alt="">
                <h1>Corrida Orbital</h1>
            </div>
            <div class="card">
                <img src="./assets/img/esquadrao-nexo.webp" alt="">
                <h1>Corrida Orbital</h1>
            </div>
        </div>

        <section id="dividido">
            <div id="formulario">
                <h2>Fale com a gente</h2>
                <p>Preencha os campos abaixo para enviar sua dúvida, sugestão ou feedback.</p>
                <p><span class="destaque">Atenção:</span> este formulário é demonstrativo e ainda não envia informações.</p>

                <form>
                <div class="linha-formulario">
                    <div class="campo-formulario">
                    <label for="nome">Seu nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="campo-formulario">
                    <label for="email">Seu e-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                    </div>
                </div>

                <div class="campo-formulario">
                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto" required>
                    <option value="">Selecione uma opção</option>
                    <option value="sugestao">Sugestão de jogo</option>
                    <option value="duvida">Dúvida</option>
                    <option value="feedback">Feedback</option>
                    <option value="parceria">Parceria</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>
                </div>

                
                <div class="termo-formulario">
                    <input type="checkbox" id="termo">
                    <label for="termo">Você aceita nossos termos e condições?</label>
                </div>
                
                <button type="submit">Enviar mensagem</button>
                </form>
            </div>

            <div id="img">
                <img src="assets/img/ecos-de-aurea.webp" alt="Exploradora diante de grandes ruínas circulares na floresta">
            </div>
        </section>
    </main>
</body>
</html>
